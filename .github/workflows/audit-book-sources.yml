name: Audit book sources

on:
  push:
    branches: [audit-book-sources-20261006]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message != 'audit result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run audit
        run: python tools/audit_book_sources.py
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: non-normal-food-audit
          path: |
            verified_non_normal_food_sources.json
            audit_non_normal_food_sources.csv
            audit_summary.json
      - name: Commit verified JSON
        run: |
          git config user.name "book-source-audit"
          git config user.email "actions@github.com"
          git add verified_non_normal_food_sources.json audit_non_normal_food_sources.csv audit_summary.json
          git diff --cached --quiet || git commit -m "audit result"
          git push origin HEAD:audit-book-sources-20261006
