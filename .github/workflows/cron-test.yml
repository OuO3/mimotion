
name: 定时触发测试

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron-test]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 输出触发时间
        run: |
          echo "触发方式：${{ github.event_name }}"
          echo "UTC 时间：$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "测试成功"
